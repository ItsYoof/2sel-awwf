<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأسئلة - لوحة المشرف</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A5C4A;
            --primary-light: #13836a;
            --secondary: #C9A227;
            --accent: #FACC15;
            --bg: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #F8FAFC;
            --text-muted: #94A3B8;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            background: radial-gradient(circle at top right, #1E293B, #0F172A);
            color: var(--text);
            font-family: 'Outfit', 'Noto Sans Arabic', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Access Protection Modal */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(10px);
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 32px;
            width: 450px;
            text-align: center;
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            margin-bottom: 24px;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card input {
            width: 100%;
            padding: 16px;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            font-size: 20px;
            color: white;
            text-align: center;
            outline: none;
        }

        .login-card input:focus { border-color: var(--secondary); }

        .login-card button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(10, 92, 74, 0.3);
        }

        .admin-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 30px 40px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
        }

        .admin-title {
            font-size: 32px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stats-badge {
            background: var(--primary);
            color: white;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .actions-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--secondary); color: white; }
        .btn-success { background: #10B981; color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--glass-border); color: white; }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .search-container {
            margin-bottom: 40px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 20px 30px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 18px;
            color: white;
            outline: none;
        }

        .search-container input:focus { border-color: var(--secondary); background: rgba(255,255,255,0.05); }

        .questions-grid {
            display: grid;
            gap: 25px;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 6px; height: 100%;
            background: var(--primary);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .q-id {
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            color: var(--secondary);
        }

        .q-text {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .q-info {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .info-block {
            flex: 1;
            min-width: 250px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 16px;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
        }

        .info-content {
            font-weight: 600;
            word-break: break-all;
        }

        .media-preview-mini {
            width: 100%;
            height: 120px;
            object-fit: contain;
            background: #000;
            border-radius: 10px;
            margin-top: 10px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 20000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: #1E293B;
            width: 700px;
            max-width: 95%;
            padding: 40px;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-weight: 700; color: var(--secondary); }
        .form-group input, .form-group textarea {
            padding: 14px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
        }

        .fab {
            position: fixed;
            bottom: 40px; left: 40px;
            width: 70px; height: 70px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(201, 162, 39, 0.4);
            z-index: 5000;
        }

        @media (max-width: 768px) {
            .admin-header { flex-direction: column; text-align: center; gap: 20px; }
            .actions-group { flex-wrap: wrap; justify-content: center; }
        }

    </style>
</head>
<body>

    <!-- Access Protection -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>دخول المشرف</h2>
            <p style="color: var(--text-muted); margin-bottom: 25px;">أدخل كلمة المرور للتحكم في الأسئلة</p>
            <input type="password" id="admin-pass" placeholder="••••">
            <button onclick="checkAccess()">دخول اللوحة</button>
            <p id="login-err" style="color: #EF4444; margin-top: 15px; display: none;">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div class="admin-container">
        <header class="admin-header">
            <div class="admin-title">
                <span style="color: var(--secondary);">AWF</span>
                <span>إدارة الأسئلة</span>
                <span id="stats" class="stats-badge">0 سؤال</span>
            </div>
            <div class="actions-group">
                <button onclick="openModal()" class="btn btn-secondary">إضافة سؤال +</button>
                <button onclick="downloadQuestions()" class="btn btn-success">تصدير للملف (Download)</button>
                <button onclick="resetToDefault()" class="btn btn-outline">إعادة ضبط ↺</button>
            </div>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="ابحث عن سؤال أو معلومة..." onkeyup="filterQuestions()">
        </div>

        <div id="questions-container" class="questions-grid">
            <!-- Questions load here -->
        </div>
    </div>

    <div class="fab" onclick="openModal()">+</div>

    <!-- Edit/Add Modal -->
    <div id="qModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin: 0; font-size: 28px;">إضافة سؤال</h2>
            <input type="hidden" id="edit-index">
            
            <div class="form-group">
                <label>نص السؤال</label>
                <textarea id="qText" rows="3"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>رابط ميديا السؤال</label>
                    <input type="text" id="qMedia">
                </div>
                <div class="form-group">
                    <label>رابط ميديا الجواب</label>
                    <input type="text" id="qAMedia">
                </div>
            </div>

            <div class="form-group">
                <label>نص الإجابة</label>
                <input type="text" id="qAnswer">
            </div>

            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button onclick="saveQuestion()" class="btn btn-primary" style="flex: 2; height: 55px;">حفظ التغييرات</button>
                <button onclick="closeModal()" class="btn btn-outline" style="flex: 1; height: 55px; border-color: #ef4444; color: #ef4444;">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script>
        let localDB = [];

        // Protection check
        function checkAccess() {
            if (document.getElementById('admin-pass').value === '512') {
                document.getElementById('login-overlay').style.display = 'none';
                initDB();
            } else {
                document.getElementById('login-err').style.display = 'block';
            }
        }

        document.getElementById('admin-pass').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkAccess(); });

        function initDB() {
            const saved = localStorage.getItem('questionsDB_sync');
            if (saved) {
                try { localDB = JSON.parse(saved); } catch(e) { localDB = [...questionsDB]; }
            } else {
                localDB = [...questionsDB];
            }
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            document.getElementById('stats').innerText = `${localDB.length} سؤال`;
            container.innerHTML = '';

            localDB.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="card-top">
                        <span class="q-id">#${i + 1}</span>
                        <div style="display: flex; gap: 8px;">
                            <button onclick="editQuestion(${i})" class="btn" style="padding: 6px 15px; font-size: 13px; background: rgba(59, 130, 246, 0.2); color: #60a5fa;">تعديل</button>
                            <button onclick="deleteQuestion(${i})" class="btn" style="padding: 6px 15px; font-size: 13px; background: rgba(239, 68, 68, 0.2); color: #f87171;">حذف</button>
                        </div>
                    </div>
                    <div class="q-text">${q.questionText}</div>
                    <div class="q-info">
                        <div class="info-block">
                            <span class="info-label">الإجابة:</span>
                            <div class="info-content" style="color: var(--secondary);">${q.answer || 'لا يوجد'}</div>
                        </div>
                        <div class="info-block">
                            <span class="info-label">الميديا (سؤل/جواب):</span>
                            <div style="display: flex; gap: 10px;">
                                ${q.media ? `<img src="${extractUrl(q.media)}" class="media-preview-mini">` : '<div class="media-preview-mini" style="display:flex;align-items:center;justify-content:center;color:#334155;">-</div>'}
                                ${q.answerMedia ? `<img src="${extractUrl(q.answerMedia)}" class="media-preview-mini">` : '<div class="media-preview-mini" style="display:flex;align-items:center;justify-content:center;color:#334155;">-</div>'}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function extractUrl(str) {
            if (str.includes('<img')) {
                const match = str.match(/src="([^"]+)"/);
                return match ? match[1] : '';
            }
            return str;
        }

        function filterQuestions() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.question-card');
            cards.forEach((card, i) => {
                const q = localDB[i];
                const content = (q.questionText + ' ' + (q.answer || '')).toLowerCase();
                card.style.display = content.includes(term) ? 'block' : 'none';
            });
        }

        function openModal(index = -1) {
            document.getElementById('edit-index').value = index;
            if (index > -1) {
                const q = localDB[index];
                document.getElementById('modalTitle').innerText = 'تعديل السؤال';
                document.getElementById('qText').value = q.questionText;
                document.getElementById('qMedia').value = q.media || '';
                document.getElementById('qAMedia').value = q.answerMedia || '';
                document.getElementById('qAnswer').value = q.answer || '';
            } else {
                document.getElementById('modalTitle').innerText = 'إضافة سؤال جديد';
                document.getElementById('qText').value = '';
                document.getElementById('qMedia').value = '';
                document.getElementById('qAMedia').value = '';
                document.getElementById('qAnswer').value = '';
            }
            document.getElementById('qModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('qModal').style.display = 'none'; }

        function editQuestion(i) { openModal(i); }

        function saveQuestion() {
            const idx = parseInt(document.getElementById('edit-index').value);
            const data = {
                questionText: document.getElementById('qText').value,
                media: document.getElementById('qMedia').value,
                answerMedia: document.getElementById('qAMedia').value,
                answer: document.getElementById('qAnswer').value
            };

            if (idx > -1) localDB[idx] = data;
            else localDB.push(data);

            localStorage.setItem('questionsDB_sync', JSON.stringify(localDB));
            closeModal();
            renderQuestions();
        }

        function deleteQuestion(i) {
            if (confirm('حذف هذا السؤال نهائياً؟')) {
                localDB.splice(i, 1);
                localStorage.setItem('questionsDB_sync', JSON.stringify(localDB));
                renderQuestions();
            }
        }

        function resetToDefault() {
            if (confirm('هل تود إلغاء كافة التغييرات والعودة للبيانات الأصلية في ملف questions.js؟')) {
                localStorage.removeItem('questionsDB_sync');
                location.reload();
            }
        }

        function downloadQuestions() {
            const jsContent = `const questionsDB = ${JSON.stringify(localDB, null, 4)};`;
            const blob = new Blob([jsContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'questions.js';
            a.click();
            URL.revokeObjectURL(url);
            alert('تم تجهيز الملف المحدث! قم باستبدال ملف questions.js الحالي بالملف الذي تم تحميله الآن.');
        }
    </script>
</body>
</html>
