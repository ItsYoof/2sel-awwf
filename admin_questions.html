<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأسئلة - لوحة المشرف</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A5C4A;
            --primary-dark: #063B30;
            --secondary: #C9A227;
            --accent: #FACC15;
            --bg-gradient: linear-gradient(180deg, #208770 0%, #0B5D4B 100%);
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --glass: rgba(255, 255, 255, 0.77);
            --glass-border: rgba(10, 92, 74, 0.1);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            color: #FFFFFF;
            font-family: 'Noto Sans Arabic', 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Navbar / Header */
        .main-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 85px;
            background: var(--glass);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 5000;
            display: flex;
            justify-content: center;
        }

        .nav-content {
            width: 100%;
            max-width: 1440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-text {
            font-weight: 900;
            font-size: 24px;
            color: var(--primary);
        }

        .main-logo-img {
            height: 50px;
            width: auto;
        }

        /* Access Protection Modal */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 92, 74, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(15px);
        }

        .login-card {
            background: #FFFFFF;
            padding: 50px;
            border-radius: 40px;
            width: 450px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.3);
        }

        .login-card h2 {
            margin-bottom: 24px;
            font-size: 32px;
            font-weight: 900;
            color: var(--primary);
        }

        .login-card input {
            width: 100%;
            padding: 16px;
            margin-bottom: 24px;
            background: #F1F5F9;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            font-size: 18px;
            color: var(--text-main);
            text-align: center;
            outline: none;
        }

        .login-card input:focus { border-color: var(--primary); }

        .login-card button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 0px var(--primary-dark);
        }

        .login-card button:active { transform: translateY(4px); box-shadow: 0 6px 0px var(--primary-dark); }

        .admin-main {
            margin-top: 120px;
            width: 100%;
            max-width: 1440px;
            align-self: center;
            padding: 40px;
        }

        .hero-title-section {
            text-align: center;
            margin-bottom: 60px;
        }

        .admin-title {
            font-weight: 900;
            font-size: 48px;
            text-shadow: 2px 2px 0px var(--secondary);
            margin-bottom: 15px;
        }

        .controls-bar {
            background: #FFFFFF;
            border-radius: 30px;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            color: var(--text-main);
        }

        .stats-badge {
            background: rgba(10, 92, 74, 0.05);
            border: 1px solid rgba(10, 92, 74, 0.1);
            padding: 10px 20px;
            border-radius: 99px;
            font-weight: 800;
            color: var(--primary);
        }

        .actions-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 6px 0px var(--primary-dark);
        }
        .btn-primary:active { transform: translateY(3px); box-shadow: 0 3px 0px var(--primary-dark); }

        .btn-secondary { background: var(--secondary); color: white; }
        .btn-outline { background: #F1F5F9; border: 1px solid #E2E8F0; color: var(--text-main); }
        .btn-danger { background: #FEE2E2; color: #EF4444; border: 1px solid #FECACA; }

        .search-wrapper {
            width: 100%;
            position: relative;
            margin-bottom: 40px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 24px 40px;
            background: #FFFFFF;
            border: none;
            border-radius: 25px;
            font-size: 20px;
            color: var(--text-main);
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            outline: none;
        }

        .search-wrapper input:focus { box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        .questions-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 30px;
        }

        .question-card {
            background: #FFFFFF;
            border-radius: 35px;
            padding: 35px;
            color: var(--text-main);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            border-bottom: 8px solid var(--primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .q-number {
            font-size: 14px;
            font-weight: 800;
            color: var(--secondary);
            background: #FFFBEB;
            padding: 4px 12px;
            border-radius: 8px;
        }

        .q-title {
            font-size: 24px;
            font-weight: 900;
            line-height: 1.4;
        }

        .ans-block {
            background: #F8FAFC;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #F1F5F9;
        }

        .ans-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .ans-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .media-previews {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .media-box {
            height: 140px;
            background: #E2E8F0;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .media-box img { width: 100%; height: 100%; object-fit: cover; }
        .media-empty { color: #94A3B8; font-size: 12px; }

        .card-footer {
            margin-top: auto;
            display: flex;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid #F1F5F9;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 92, 74, 0.6);
            backdrop-filter: blur(15px);
            z-index: 20000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #FFFFFF;
            width: 750px;
            max-width: 95%;
            padding: 50px;
            border-radius: 40px;
            color: var(--text-main);
            box-shadow: 0 50px 100px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title { font-size: 32px; font-weight: 900; color: var(--primary); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; font-weight: 800; color: var(--primary); }
        .form-group input, .form-group textarea {
            padding: 16px;
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
        }
        .form-group input:focus { border-color: var(--primary); outline: none; }

        .fab {
            position: fixed;
            bottom: 40px; left: 40px;
            width: 75px; height: 75px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(201, 162, 39, 0.4);
            z-index: 5000;
        }

        @media (max-width: 768px) {
            .admin-header { flex-direction: column; text-align: center; gap: 20px; }
            .actions-group { flex-wrap: wrap; justify-content: center; }
        }

    </style>
</head>
<body class="admin-body">

    <header class="main-nav">
        <div class="nav-content">
            <div class="logo-group" onclick="location.href='index.html'">
                <img src="شعار أوف.svg" alt="Logo" class="main-logo-img">
                <h1 class="logo-text">أسئل أووف</h1>
            </div>
            <div class="stats-badge" id="stats-header">0 سؤال في القاعدة</div>
        </div>
    </header>

    <div id="login-overlay">
        <div class="login-card">
            <h2>لوحة الإدارة</h2>
            <p style="color: var(--text-muted); margin-bottom: 25px;">أدخل كلمة المرور للتحكم في الأسئلة</p>
            <input type="password" id="admin-pass" placeholder="••••">
            <button onclick="checkAccess()">دخول اللوحة</button>
            <p id="login-err" style="color: #ef4444; margin-top: 15px; display: none;">كلمة المرور خاطئة!</p>
        </div>
    </div>

    <main class="admin-main">
        <section class="hero-title-section">
            <h1 class="admin-title">إدارة قاعدة البيانات</h1>
            <p style="opacity: 0.8;">تحكم، عدل، أضف، وحدث المحتوى بكل سهولة.</p>
        </section>

        <div class="search-wrapper">
            <input type="text" id="searchInput" onkeyup="filterQuestions()" placeholder="ابحث عن سؤال أو كلمة معينة...">
        </div>

        <div class="controls-bar">
            <div class="stats-badge" id="stats">0 سؤال</div>
            <div class="actions-group">
                <button onclick="openModal()" class="btn btn-primary">إضافة سؤال +</button>
                <button onclick="downloadQuestions()" class="btn btn-outline" style="border-color: var(--secondary); color: var(--secondary)">تصدير (Download)</button>
                <button onclick="resetToDefault()" class="btn btn-danger">إعادة ضبط ↺</button>
            </div>
        </div>

        <div class="questions-list" id="questions-container">
            <!-- Questions will be loaded here via renderQuestions() -->
        </div>
    </main>

    <div class="modal" id="qModal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">إضافة سؤال</h2>
            
            <div class="form-group">
                <label>نص السؤال</label>
                <textarea id="qText" rows="3" placeholder="اكتب السؤال هنا..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>رابط ميديا السؤال (صورة/فيديو)</label>
                    <input type="text" id="qMedia" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>رابط ميديا الإجابة</label>
                    <input type="text" id="qAMedia" placeholder="https://...">
                </div>
            </div>

            <div class="form-group">
                <label>الإجابة الصحيحة</label>
                <input type="text" id="qAnswer" placeholder="الجواب هو...">
            </div>

            <input type="hidden" id="edit-index">

            <div class="card-footer" style="border: none; padding-top: 10px;">
                <button onclick="saveQuestion()" class="btn btn-primary" style="flex: 2; height: 50px; justify-content: center;">حفــــظ التغييرات</button>
                <button onclick="closeModal()" class="btn btn-outline" style="flex: 1; height: 50px; justify-content: center;">إلغاء</button>
            </div>
        </div>
    </div>

    <button class="fab" onclick="openModal()">+</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script>
        // ─── Auto-Sync Database logic ───
        (function autoSyncDB() {
            try {
                const storedMeta = JSON.parse(localStorage.getItem('questionsDB_sync_Meta') || '{}');
                const fileMeta = (typeof questionsDB_Meta !== 'undefined') ? questionsDB_Meta : { version: "0" };
                const needsUpdate = !localStorage.getItem('questionsDB_sync') || (fileMeta.version !== storedMeta.version);

                if (needsUpdate && typeof questionsDB !== 'undefined') {
                    localStorage.setItem('questionsDB_sync', JSON.stringify(questionsDB));
                    localStorage.setItem('questionsDB_sync_Meta', JSON.stringify(fileMeta));
                }
            } catch(e) { console.error("Sync error:", e); }
        })();
    </script>
    <script>
        let localDB = [];

        // Protection check
        function checkAccess() {
            if (document.getElementById('admin-pass').value === '512') {
                document.getElementById('login-overlay').style.display = 'none';
                initDB();
            } else {
                document.getElementById('login-err').style.display = 'block';
            }
        }

        document.getElementById('admin-pass').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkAccess(); });

        function initDB() {
            const saved = localStorage.getItem('questionsDB_sync');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.length > 0) {
                        localDB = parsed;
                    } else {
                        localDB = [...questionsDB];
                        saveToLocal();
                    }
                } catch(e) {
                    localDB = [...questionsDB];
                    saveToLocal();
                }
            } else {
                // First time - load from file and persist
                localDB = [...questionsDB];
                saveToLocal();
            }
            renderQuestions();
        }

        function saveToLocal() {
            localStorage.setItem('questionsDB_sync', JSON.stringify(localDB));
            // Notify other tabs (game.html) via dispatchEvent
            // Note: storage events only fire in OTHER tabs, not the current one
            // This manually triggers for any same-page listeners
            try {
                window.dispatchEvent(new StorageEvent('storage', {
                    key: 'questionsDB_sync',
                    newValue: JSON.stringify(localDB)
                }));
            } catch(e) {}
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            const total = localDB.length;
            document.getElementById('stats').innerText = `${total} سؤال`;
            document.getElementById('stats-header').innerText = `${total} سؤال في القاعدة`;
            container.innerHTML = '';

            localDB.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="q-number">سؤال رقم #${i + 1}</span>
                    </div>
                    <div class="q-title">${q.questionText}</div>
                    
                    <div class="ans-block">
                        <span class="ans-label">الإجابة النموذجية</span>
                        <div class="ans-text">${q.answer || 'لا توجد إجابة محددة'}</div>
                    </div>

                    <div class="media-previews">
                        <div class="media-box">
                            ${q.media ? `<img src="${extractUrl(q.media)}">` : '<span class="media-empty">لا توجد ميديا للسؤال</span>'}
                        </div>
                        <div class="media-box">
                            ${q.answerMedia ? `<img src="${extractUrl(q.answerMedia)}">` : '<span class="media-empty">لا توجد ميديا للجواب</span>'}
                        </div>
                    </div>

                    <div class="card-footer">
                        <button onclick="editQuestion(${i})" class="btn btn-outline" style="flex: 1; justify-content: center; background: #F8FAFC;">تعديل</button>
                        <button onclick="deleteQuestion(${i})" class="btn btn-danger" style="flex: 1; justify-content: center;">حذف</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function extractUrl(str) {
            if (str.includes('<img')) {
                const match = str.match(/src="([^"]+)"/);
                return match ? match[1] : '';
            }
            return str;
        }

        function filterQuestions() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.question-card');
            cards.forEach((card, i) => {
                const q = localDB[i];
                const content = (q.questionText + ' ' + (q.answer || '')).toLowerCase();
                card.style.display = content.includes(term) ? 'block' : 'none';
            });
        }

        function openModal(index = -1) {
            document.getElementById('edit-index').value = index;
            if (index > -1) {
                const q = localDB[index];
                document.getElementById('modalTitle').innerText = 'تعديل السؤال';
                document.getElementById('qText').value = q.questionText;
                document.getElementById('qMedia').value = q.media || '';
                document.getElementById('qAMedia').value = q.answerMedia || '';
                document.getElementById('qAnswer').value = q.answer || '';
            } else {
                document.getElementById('modalTitle').innerText = 'إضافة سؤال جديد';
                document.getElementById('qText').value = '';
                document.getElementById('qMedia').value = '';
                document.getElementById('qAMedia').value = '';
                document.getElementById('qAnswer').value = '';
            }
            document.getElementById('qModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('qModal').style.display = 'none'; }

        function editQuestion(i) { openModal(i); }

        function saveQuestion() {
            const idx = parseInt(document.getElementById('edit-index').value);
            const data = {
                questionText: document.getElementById('qText').value,
                media: document.getElementById('qMedia').value,
                answerMedia: document.getElementById('qAMedia').value,
                answer: document.getElementById('qAnswer').value
            };

            if (idx > -1) localDB[idx] = data;
            else localDB.push(data);

            saveToLocal();
            closeModal();
            renderQuestions();
        }

        function deleteQuestion(i) {
            if (confirm('حذف هذا السؤال نهائياً؟')) {
                localDB.splice(i, 1);
                saveToLocal();
                renderQuestions();
            }
        }

        function resetToDefault() {
            if (confirm('هل تود إلغاء كافة التغييرات والعودة للبيانات الأصلية في ملف questions.js؟')) {
                localDB = [...questionsDB];
                saveToLocal();
                renderQuestions();
            }
        }

        function downloadQuestions() {
            const jsContent = `const questionsDB = ${JSON.stringify(localDB, null, 4)};`;
            const blob = new Blob([jsContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'questions.js';
            a.click();
            URL.revokeObjectURL(url);
            alert('تم تجهيز الملف المحدث! قم باستبدال ملف questions.js الحالي بالملف الذي تم تحميله الآن.');
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'questionsDB_sync') {
                initDB();
            }
        });
    </script>
</body>
</html>
